 <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- 부트스트랩 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   

    <script src="app.js" defer></script>

</head>
<body>
    <header id="top" style="background-color: aquamarine;">
        <div class="w-100 d-flex justify-content-between p-4 m-1">
            <div id="top-left">                
                <h1><strong class="text-decoration-none text-dark">HAC 인원 관리 시스템</strong></h1>
            </div>
        </div>
    </header>
    <main style="margin: 10px">
        <div id="adding_button" style="margin: 10px">
            <h1>현학기 인원 관리</h1>
            <a href="./crud.html">사용 방법</a>
            <form id="memberForm" novalidate>
                <input type="text" aria-label="이름" id="name" name="name" style="width: 300px" class="form-control mt-1" placeholder="이름 입력">
                <input type="number" aria-label="학번" id="studentId" name="studentId" required min="16000000" max="26999999" step="1" style="width: 300px" class="form-control mt-1" placeholder="학번 입력">
                <input type="text" aria-label="별명" id="nickName" name="nickName" style="width: 300px" class="form-control mt-1" placeholder="별명 입력">
                <input type="number" aria-label="출석 횟수" id="attendence" name="attendence" required min="0" step="1" style="width: 300px" class="form-control mt-1" placeholder="출석 횟수 입력">
                <input type="tel" aria-label="전화번호" id="phone" name="phone" style="width: 300px" class="form-control mt-1" placeholder="전화번호 입력">
                <button type="submit" id="addBtn" style="margin-top: 10px" class="btn btn-primary"><i class="bi bi-person-add"></i> 등록</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary" hidden>취소</button>
            </form>
            
        </div>
        <div id="middle_main" style="overflow-x: auto">
            <label for="search">이름 또는 별명 검색</label>
            <input type="search" id="search" class="form-control mb-2" placeholder="검색어 입력">
            <table class="table table-striped table-responsive table-sm w-100 text-center table-bordered">
                <thead><tr id="top-frame">
                    <th>이름</th>
                    <th>학번</th>
                    <th>별명</th>
                    <th>출석 횟수</th>
                    <th>전화번호</th>
                    <th>수정</th>
                    <th>삭제</th>
                </tr></thead>
                <tbody id="java_auto_add_theMemberList"></tbody>
            </table>
        </div>
    </main>

    <footer id="buttom-frame" style="background-color: aquamarine;" class="w-100 d-flex justify-content-between p-4">
        <div id="buttom-main">             
            <h1><strong class="text-decoration-none text-dark">HAC 인원 관리 시스템</strong></h1>
        </div>
    </footer>

</body>
</html>
